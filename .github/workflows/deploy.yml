name: Deploy Hugo Blog

# 触发条件：push到main分支；支持网页/插件手动运行
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# =========新增权限配置，解决403 denied关键=========
permissions:
  contents: write

env:
  HUGO_VERSION: 0.165.0
  DART_SASS_VERSION: 1.77.8

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取代码，包含git submodule主题
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 下载独立 Dart‑Sass 二进制，加入PATH
      - name: Install Dart‑Sass standalone
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${{ env.DART_SASS_VERSION }}/dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz"
          mkdir -p $HOME/.local/dart-sass
          tar -C $HOME/.local/dart-sass -xf "${{ runner.temp }}/dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz"
          echo "$HOME/.local/dart-sass" >> $GITHUB_PATH

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check tool versions
        run: |
          hugo version
          sass --version

      # 3.构建站点，压缩资源
      - name: Build Hugo
        run: hugo --gc --minify

      # 4.部署静态文件到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true # gh-pages分支只保留最新构建产物