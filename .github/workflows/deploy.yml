name: Deploy Hugo Blog

# 触发条件：push到main分支；支持网页/插件手动运行
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GitHub Pages 官方部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  # 1.构建站点
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hugo extended 已内置 Embedded Dart Sass，无需单独安装 dart-sass
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check tool versions
        run: |
          hugo version

      - name: Build Hugo
        run: hugo --gc --minify

      # 将构建产物 public/ 上传为部署 artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 2.部署到 GitHub Pages（官方 Actions 方式，不经过 gh-pages 分支）
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4