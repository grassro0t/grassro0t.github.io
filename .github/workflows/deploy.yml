name: Deploy Hugo Blog

# 触发条件：push到main分支；支持网页/插件手动运行
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# =========新增权限配置，解决403 denied关键=========
permissions:
  contents: write

env:
  HUGO_VERSION: 0.165.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取代码，包含git submodule主题
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Hugo extended 已内置 Embedded Dart Sass，无需单独安装 dart-sass
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check tool versions
        run: |
          hugo version

      # 3.构建站点，压缩资源
      - name: Build Hugo
        run: hugo --gc --minify

      # 4.部署静态文件到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true # gh-pages分支只保留最新构建产物