# ===================== Hugo 全局基础配置 =====================
baseURL = "https://grassro0t.github.io/"
title = "grassro0t的博客"
theme = "FixIt"
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
timeZone = "Asia/Shanghai"
hasCJKLanguage = true
summaryLength = 120
# 开启hugo自动生成 robots.txt
enableRobotsTXT = true
# 必须开启sitemap
disableKinds = []   # 不要写 "sitemap"，会关闭站点地图

[outputs]
# FixIt 搜索依赖 home 的 "search" 输出格式，用于生成 /search.json 索引文件
# FixIt 归档页由 home 的 "archives" 输出格式渲染（layouts/home.archives.html）
home = ["HTML", "RSS", "archives", "search"]
_merge = "shallow"

[markup]
_merge = "shallow"

[taxonomies]
_merge = "shallow"

[markup.highlight]
codeFences = true
guessSyntax = true
noClasses = false
lineNos = true
lineNumbersInTable = true

# ===================== 主题参数 params =====================
[params]
version = "0.4.5"
description = "Hugo FixIt博客"

# ⚠️重点！v0.4.5 author是map，绝对不能写 author = "名字"
[params.author]
name = "grassro0t"
link = "https://github.com/GrassRo0t"
email = "julian.song.work@outlook.com"
avatar = "/avatar.webp"

# 页头设置
[params.header.title]
name = "Ro0tRo0m"

# 页脚
[params.footer]
hugo = false
copyright = true
author = true
since = 2026

[params.appearance]
pageStyle = "wide" # 页面宽度，wide更舒展，默认normal；narrow偏窄
global_font_size = "16px"

[params.home.profile]
enable = true #开启首页个人简介块（头像、昵称、简介、社交图标）
onlyFirstPage = true   # 只在第一页显示profile
title = "grassro0t"
subtitle = "C++后端｜技术笔记｜心理分析"
typeit = true
social = true

[params.social]
GitHub = "https://github.com/GrassRo0t"
Email = "julian.song.work@outlook.com"
RSS = true

# Pangu：自动在中英文之间插入空格，优化中文排版（可选，开启后全文生效）
[params.pangu]
enable = true

# 页面配置 toc必须子表，禁止toc=true
[params.page]
lightgallery = true
twemoji = true
# 启用 instant.page 预加载（鼠标悬停链接时预加载，提升浏览体验）
instantPage = true

# 数学公式支持（KaTeX 引擎；$...$ 行内公式 / $$...$$ 独立公式块）
[params.page.math]
enable = true
type = "katex"

[params.page.toc]
enable = true
keepStatic = false
auto = true
position = "right"

# ========== 评论系统（Giscus，基于 GitHub Discussions） ==========
# 全局开启评论；单篇文章可用 front matter comment: false 单独关闭
[params.page.comment]
enable = true

[params.page.comment.giscus]
enable = true
repo = "grassro0t/grassro0t.github.io"
repoId = "R_kgDOT4Lznw"
category = "Announcements"
categoryId = "DIC_kwDOT4Lzn84DDWxc"
mapping = "title"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
lang = "zh-CN"
lightTheme = "light"
darkTheme = "dark"

# Fuse.js 本地搜索
# type 可选值：["algolia", "fuse", "cse", "post-chat"]
[params.search]
enable = true
type = "fuse"

# Fuse 检索参数（针对中文优化：minMatchCharLength 设为 1）
[params.search.fuse]
isCaseSensitive = false
minMatchCharLength = 1
findAllMatches = false
location = 0
threshold = 0.3
distance = 100
ignoreLocation = false
useExtendedSearch = false
ignoreFieldNorm = false

# 顶部菜单
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 2

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 3

[[menu.main]]
name = "分类"
url = "/categories/"
weight = 4

[[menu.main]]
name = "关于"
url = "/about/"
weight = 5